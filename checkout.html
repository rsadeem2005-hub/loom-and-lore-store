<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Loom & Lore</title>
<style>body{margin:0;background:#f7f3eb;color:#242522;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:70px 24px}.brand{font:26px Georgia,serif;color:#173f35;margin-bottom:55px}h1{font:400 48px Georgia,serif;color:#173f35}p{color:#756f66;line-height:1.6}form{display:grid;gap:16px;margin-top:35px}label{font-size:13px}input{padding:14px;border:1px solid #d8d0c3;background:#fbf9f4;font-size:15px}button{padding:15px;background:#173f35;color:#fff;border:0;font-size:15px;cursor:pointer;margin-top:10px}.note{font-size:12px}</style></head>
<body><main><div class="brand">Loom & Lore</div><h1>Almost yours.</h1><p>A quiet checkout for a considered purchase.</p>
<form onsubmit="placeOrder(event)"><label>Email<input type="email" required></label><label>Name<input required></label><label>Address<input required></label><label>City<input required></label><button>Place order</button></form><p class="note">This checkout is for the portfolio storefront and does not process real payments.</p></main>
<script>function placeOrder(e){e.preventDefault();localStorage.removeItem('loomCart');alert('Thank you — your order has been placed.');location.href='index.html'}</script></body></html>
